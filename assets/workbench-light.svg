<svg xmlns="http://www.w3.org/2000/svg" width="360" height="120" viewBox="0 0 360 120">
<title>A little mechanical workbench</title>
<style>
 .arm { transform-origin:174px 87px; animation:reach 10s ease-in-out infinite; }
 .pixel { animation:carry 10s ease-in-out infinite; }
 .eye { animation:blink 10s linear infinite; transform-origin:163px 37px; }
 @keyframes reach { 0%,15%,85%,100% {transform:rotate(-12deg)} 40%,60% {transform:rotate(12deg)} }
 @keyframes carry { 0%,15%,85%,100% {transform:translate(0,0)} 40%,60% {transform:translate(38px,-15px)} }
 @keyframes blink { 0%,68%,72%,100% {transform:scaleY(1)} 70% {transform:scaleY(.12)} }
 @media (prefers-reduced-motion:reduce) { .arm,.pixel,.eye {animation:none} }
</style>
